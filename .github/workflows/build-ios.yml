# ─────────────────────────────────────────────────────────────────────────────
#  Mbote BitChat — Build iOS
#  ─ Sans certificats Apple : build SIMULATEUR signé none (artefact dev,
#    le Bluetooth exige un appareil réel — c'est un artefact de CI, pas un
#    produit distribuable).
#  ─ Avec certificats Apple (compte Developer 99 $/an) : archive + IPA signée
#    (ad-hoc / App Store / TestFlight) — voir docs/CI-CD.md
#  ─ macOS runner : gratuit pour les repos publics
# ─────────────────────────────────────────────────────────────────────────────
name: iOS (IPA / simulateur)

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read # F-50 : lecture seule au niveau workflow — PR sans jeton d'écriture

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: write # requis pour publier l'artefact/release sur tag v*.*.*
    name: Build iOS
    runs-on: macos-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 — épinglé par SHA (supply chain, condition 6)
        with:
          fetch-depth: 0

      - name: Bun (version pinned = lockfile reproductible)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0 — épinglé par SHA
        with:
          bun-version: "1.3.14"

      - name: Installer les dépendances JS
        working-directory: mobile
        run: bun install --frozen-lockfile

      - name: Portail qualité — TypeScript strict
        working-directory: mobile
        run: bunx tsc --noEmit

      - name: Portail qualité — parité protocole web ↔ mobile (F-22)
        run: bun run check:parity

      - name: Générer le projet iOS (Expo prebuild + CocoaPods)
        working-directory: mobile
        run: bunx expo prebuild --platform ios --clean

      - name: Versionnage (MARKETING_VERSION + build = nb de commits)
        id: version
        run: |
          BUILD_CODE=$(git rev-list --count HEAD)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(bun -e "console.log(require('./mobile/app.json').expo.version)")
          fi
          cd mobile/ios
          sed -i '' -E "s/MARKETING_VERSION = [0-9.]+;/MARKETING_VERSION = ${VERSION};/g" *.xcodeproj/project.pbxproj
          sed -i '' -E "s/CURRENT_PROJECT_VERSION = [0-9]+;/CURRENT_PROJECT_VERSION = ${BUILD_CODE};/g" *.xcodeproj/project.pbxproj
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "code=${BUILD_CODE}" >> "$GITHUB_OUTPUT"
          echo "→ MARKETING_VERSION ${VERSION} · build ${BUILD_CODE}"

      - name: Découvrir le schéma Xcode
        id: scheme
        run: |
          cd mobile/ios
          # -d indispensable : .xcworkspace est un RÉPERTOIRE (ls sans -d
          # liste son contenu → « contents.xcworkspacedata »)
          WORKSPACE=$(ls -d *.xcworkspace | head -n1)
          # Le prebuild Expo nomme workspace ET schéma d'après app.json →
          # « MboteMesh ». On ne peut PAS se fier à un filtre « bitchat »
          # (le slug n'est pas le nom du schéma) : on tombait alors sur le
          # premier schéma de pod (ex. « boost ») → aucun .app produit.
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          SCHEMES=$(xcodebuild -list -json -workspace "$WORKSPACE" | jq -r '.workspace.schemes[]')
          if ! grep -qxF "$SCHEME" <<< "$SCHEMES"; then
            SCHEME=$(echo "$SCHEMES" | grep -v '^Pods' | head -n1)
          fi
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "→ workspace : $WORKSPACE · schéma : $SCHEME"

      - name: Build simulateur (sans signature — toujours produit)
        run: |
          cd mobile/ios
          xcodebuild \
            -workspace *.xcworkspace \
            -scheme "${{ steps.scheme.outputs.scheme }}" \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO -quiet build
          APP=$(find build/Build/Products/Release-iphonesimulator -maxdepth 1 -name '*.app' | head -n1)
          if [ -z "$APP" ]; then
            echo "❌ aucun .app produit — vérifier le schéma : ${{ steps.scheme.outputs.scheme }}"
            exit 1
          fi
          ditto -c -k --keepParent "$APP" \
            "$GITHUB_WORKSPACE/mbote-v${{ steps.version.outputs.version }}-ios-simulateur.zip"
          echo "✅ artefact simulateur : $(basename "$APP")"

      - name: Préparer la signature (si certificats Apple configurés)
        id: signing
        env:
          CERT_B64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERT_PASS: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROFILE_B64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          if [ -z "$CERT_B64" ] || [ -z "$PROFILE_B64" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "→ pas de certificat Apple : IPA signée ignorée (simulateur seul)"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          KEYCHAIN="$RUNNER_TEMP/mbote.keychain-db"
          # F-50 : mot de passe keychain éphémère (unique à ce run, jamais en dur)
          KC_PASS="$(openssl rand -hex 24)"
          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          echo "$CERT_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASS" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PASS" "$KEYCHAIN" > /dev/null
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROFILE_B64" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/mbote.mobileprovision"
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' /dev/stdin <<< \
            "$(security cms -D -i "$HOME/Library/MobileDevice/Provisioning Profiles/mbote.mobileprovision")")
          echo "profile_name=$PROFILE_NAME" >> "$GITHUB_OUTPUT"
          echo "→ certificat + profil « $PROFILE_NAME » importés"

      - name: Archive + export IPA signée
        if: steps.signing.outputs.enabled == 'true'
        env:
          EXPORT_METHOD: ${{ secrets.APPLE_EXPORT_METHOD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_NAME: ${{ steps.signing.outputs.profile_name }}
          SCHEME: ${{ steps.scheme.outputs.scheme }}
        run: |
          cd mobile/ios
          cat > ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>__METHOD__</string>
            <key>signingStyle</key><string>manual</string>
            <key>stripSwiftSymbols</key><true/>
            <key>teamID</key><string>__TEAM__</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>org.mbote.bitchat</key><string>__PROFILE__</string>
            </dict>
          </dict>
          </plist>
          PLIST
          sed -i '' "s|__METHOD__|${EXPORT_METHOD:-ad-hoc}|" ExportOptions.plist
          sed -i '' "s|__TEAM__|${TEAM_ID}|" ExportOptions.plist
          sed -i '' "s|__PROFILE__|${PROFILE_NAME}|" ExportOptions.plist

          xcodebuild \
            -workspace *.xcworkspace \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Mbote.xcarchive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            -quiet archive

          xcodebuild -exportArchive \
            -archivePath build/Mbote.xcarchive \
            -exportPath build \
            -exportOptionsPlist ExportOptions.plist

          IPA=$(find build -name '*.ipa' | head -n1)
          cp "$IPA" "$GITHUB_WORKSPACE/mbote-v${{ steps.version.outputs.version }}-ios.ipa"
          echo "✅ IPA signée : $(basename "$IPA") (méthode ${EXPORT_METHOD:-ad-hoc})"

      - name: Publier les artefacts (tous les builds)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2 — épinglé par SHA
        with:
          name: mbote-ios-v${{ steps.version.outputs.version }}-r${{ github.run_number }}
          path: |
            mbote-v*-ios-simulateur.zip
            mbote-v*-ios.ipa
          if-no-files-found: warn
          retention-days: 14

      - name: Préparer les notes de release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if ls mbote-v*-ios.ipa >/dev/null 2>&1; then MODE="IPA signée (${{ secrets.APPLE_EXPORT_METHOD || 'ad-hoc' }}) + build simulateur"; else MODE="build simulateur uniquement (configure les certificats Apple pour l'IPA — docs/CI-CD.md)"; fi
          cat > RELEASE_IOS.md <<EOF
          ## 🍎 Mbote BitChat ${{ steps.version.outputs.version }} — iOS

          - **MARKETING_VERSION** ${{ steps.version.outputs.version }} · **build** ${{ steps.version.outputs.code }}
          - **commit** ${{ github.sha }}
          - **Artefacts** : ${MODE}

          ⚠️ Rappel Apple : l'installation sur iPhone hors App Store exige un compte
          Apple Developer (99 $/an) et un profil de provisionnement. Sans cela, les
          utilisateurs iOS disposent de la PWA web (offline-capable).
          EOF

      - name: Publier la GitHub Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v2.6.2 — épinglé par SHA
        with:
          files: |
            mbote-v*-ios.ipa
            mbote-v*-ios-simulateur.zip
          body_path: RELEASE_IOS.md
          generate_release_notes: true
          fail_on_unmatched_files: false
