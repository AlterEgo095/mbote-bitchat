# ─────────────────────────────────────────────────────────────────────────────
#  Mbote BitChat — Build Android (APK)
#  ─ Android : runner Linux, gratuit à vie (repo public)
#  ─ Sans secrets  → APK signé clé debug (installable en sideload, tests)
#  ─ Avec secrets  → APK signé keystore production (voir docs/CI-CD.md)
#  ─ Chaque tag v*.*.* publie une GitHub Release avec l'APK
# ─────────────────────────────────────────────────────────────────────────────
name: Android (APK)

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read # F-50 : lecture seule au niveau workflow — PR sans jeton d'écriture

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build APK release
    permissions:
      contents: write # requis uniquement pour publier la Release sur tag v*.*.*
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt (historique complet → versionCode monotone)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.4.0 — épinglé par SHA (supply chain, condition 6)
        with:
          fetch-depth: 0

      - name: Bun (version pinned = lockfile reproductible)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0 — épinglé par SHA
        with:
          bun-version: "1.3.14"

      - name: Installer les dépendances JS
        working-directory: mobile
        run: bun install --frozen-lockfile

      - name: Portail qualité — TypeScript strict
        working-directory: mobile
        run: bunx tsc --noEmit

      - name: Portail qualité — parité protocole web ↔ mobile (F-22)
        run: bun run check:parity

      - name: JDK 17 (requis par React Native 0.76)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1 — épinglé par SHA
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0 — épinglé par SHA
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/modules/mbote-ble/android/**/build.gradle', 'mobile/package.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Générer le projet Android (Expo prebuild)
        working-directory: mobile
        run: bunx expo prebuild --platform android --no-install --clean

      - name: Versionnage (versionName + versionCode = nb de commits)
        id: version
        run: |
          BUILD_CODE=$(git rev-list --count HEAD)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(bun -e "console.log(require('./mobile/app.json').expo.version)")
          fi
          sed -i -E "s/versionCode [0-9]+/versionCode ${BUILD_CODE}/" mobile/android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"${VERSION}\"/" mobile/android/app/build.gradle
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "code=${BUILD_CODE}" >> "$GITHUB_OUTPUT"
          echo "→ versionName ${VERSION} · versionCode ${BUILD_CODE}"

      - name: Injecter la signature (production si secrets, sinon debug installable)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p mobile/android/app
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > mobile/android/app/mbote-release.keystore
            {
              echo "storeFile=mbote-release.keystore"
              echo "storePassword=${ANDROID_KEYSTORE_PASSWORD}"
              echo "keyAlias=${ANDROID_KEY_ALIAS}"
              echo "keyPassword=${ANDROID_KEY_PASSWORD}"
            } > mobile/android/app/keystore.properties
            echo "SIGNING_MODE=signature production (keystore)" >> "$GITHUB_ENV"
          else
            echo "SIGNING_MODE=signature debug (build de test, installable)" >> "$GITHUB_ENV"
          fi
          cp mobile/scripts/mbote-signing.gradle mobile/android/app/
          grep -q mbote-signing mobile/android/app/build.gradle || \
            printf '\napply from: "mbote-signing.gradle"\n' >> mobile/android/app/build.gradle

      - name: Construire l'APK release
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g"
        run: |
          cd mobile/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Stager l'APK
        run: |
          APK=$(ls mobile/android/app/build/outputs/apk/release/*.apk | head -n1)
          cp "$APK" "mbote-v${{ steps.version.outputs.version }}-android.apk"
          ls -lh mbote-v*-android.apk

      - name: Publier l'artefact (tous les builds)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2 — épinglé par SHA
        with:
          name: mbote-android-v${{ steps.version.outputs.version }}-r${{ github.run_number }}
          path: mbote-v*-android.apk
          retention-days: 14

      - name: Préparer les notes de release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cat > RELEASE.md <<EOF
          ## 📱 Mbote BitChat ${{ steps.version.outputs.version }} — Android

          - **versionName** ${{ steps.version.outputs.version }} · **versionCode** ${{ steps.version.outputs.code }}
          - **commit** ${{ github.sha }}
          - **Signature** : ${SIGNING_MODE}

          **Installation (aucun Play Store requis)** :
          1. Télécharge l'APK ci-dessous (ou via le lien permanent « Releases » du dépôt)
          2. Autorise « Installer des applications inconnues » pour ton navigateur/fichier
          3. Installe — l'app démarre en mode mesh BLE, même sans internet

          🔐 La signature « debug » est prévue pour les tests. Pour une distribution
          publique stable, configure le keystore production (docs/CI-CD.md).
          EOF

      - name: Publier la GitHub Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2 — épinglé par SHA
        with:
          files: mbote-v*-android.apk
          body_path: RELEASE.md
          generate_release_notes: true
          fail_on_unmatched_files: true
