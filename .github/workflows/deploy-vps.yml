# ─────────────────────────────────────────────────────────────────────────────
#  Mbote BitChat — Déploiement VPS
#  ─ rsync du commit exact → docker compose up -d --build
#  ─ En cas d'échec de build : les anciens conteneurs continuent de tourner
#  ─ Idempotent : premier déploiement == 100e déploiement
#  ─ Secrets requis : VPS_HOST, VPS_USER, VPS_SSH_KEY (docs/CI-CD.md)
#  ─ Secrets temps réel (F-09, à créer dans GitHub → Settings → Secrets) :
#    NEXT_PUBLIC_SOCKET_URL, RELAY_ALLOWED_ORIGIN, SEED_SECRET,
#    RELAY_EMIT_TOKEN (F-51) et MBOTE_BOT_KEY (F-29) — écrits dans le .env VPS.
#  ─ Le rsync PRÉSERVE le .env et docker-compose.override.yml du serveur
#    (bindings 127.0.0.1 selon la convention nginx-hôte, ports non standards).
# ─────────────────────────────────────────────────────────────────────────────
name: Déploiement VPS

permissions:
  contents: read # F-50 : le déploiement n'a besoin d'aucune écriture sur le dépôt

on:
  push:
    branches: [main]
    paths-ignore:
      - "mobile/**"
      - "docs/**"
      - "**.md"
  workflow_dispatch:

concurrency:
  group: vps-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: rsync + docker compose
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      VPS_DIR: ${{ secrets.VPS_DEPLOY_DIR || '/opt/mbote-bitchat' }}
      VPS_WEB_PORT: ${{ secrets.VPS_WEB_PORT || '3000' }}
    steps:
      - uses: actions/checkout@v4

      - name: Bun (portail qualité — lint web)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Portail qualité — lint web
        run: |
          bun install --frozen-lockfile
          bun run lint

      - name: Garde — secrets VPS configurés ?
        id: guard
        run: |
          if [ -n "$VPS_HOST" ] && [ -n "$VPS_USER" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "→ déploiement vers $VPS_USER@$VPS_HOST:$VPS_DIR"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Secrets VPS absents (VPS_HOST, VPS_USER, VPS_SSH_KEY) — déploiement ignoré. Voir docs/CI-CD.md"
          fi

      - name: Empreinte du déploiement
        run: echo "$GITHUB_SHA" > .deploy-commit

      - name: Synchroniser le code (rsync du commit exact)
        if: steps.guard.outputs.ok == 'true'
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_mbote_ci
          chmod 600 ~/.ssh/id_mbote_ci
          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          rsync -az --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude '.next' \
            --exclude 'mobile' \
            --exclude 'docs' \
            --exclude 'tests' \
            --exclude 'db' \
            --exclude 'download' \
            --exclude 'tool-results' \
            --exclude '.zscripts' \
            --exclude '.claude' \
            --exclude 'skills' \
            --exclude '.env' \
            --exclude '.env.local' \
            --exclude 'docker-compose.override.yml' \
            --exclude '*.log' \
            -e "ssh -p ${VPS_PORT} -i ~/.ssh/id_mbote_ci -o IdentitiesOnly=yes" \
            ./ "$VPS_USER@$VPS_HOST:$VPS_DIR/"
          echo "✅ code synchronisé (commit $(cat .deploy-commit))"

      - name: Environnement de build (.env sur le VPS — 5 variables critiques)
        if: steps.guard.outputs.ok == 'true'
        run: |
          {
            echo "NEXT_PUBLIC_SOCKET_URL=${NEXT_PUBLIC_SOCKET_URL}"
            echo "RELAY_ALLOWED_ORIGIN=${RELAY_ALLOWED_ORIGIN}"
            echo "SEED_SECRET=${SEED_SECRET}"
            echo "RELAY_EMIT_TOKEN=${RELAY_EMIT_TOKEN}"
            echo "MBOTE_BOT_KEY=${MBOTE_BOT_KEY}"
          } | ssh -p "$VPS_PORT" -i ~/.ssh/id_mbote_ci -o IdentitiesOnly=yes "$VPS_USER@$VPS_HOST" "cat > '$VPS_DIR/.env'"
          ssh -p "$VPS_PORT" -i ~/.ssh/id_mbote_ci -o IdentitiesOnly=yes "$VPS_USER@$VPS_HOST" "chmod 600 '$VPS_DIR/.env'"
          echo "✅ .env écrit sur le VPS (F-09/F-51/F-29/F-02 — 5 variables)"
        env:
          NEXT_PUBLIC_SOCKET_URL: ${{ secrets.NEXT_PUBLIC_SOCKET_URL }}
          RELAY_ALLOWED_ORIGIN: ${{ secrets.RELAY_ALLOWED_ORIGIN }}
          SEED_SECRET: ${{ secrets.SEED_SECRET }}
          RELAY_EMIT_TOKEN: ${{ secrets.RELAY_EMIT_TOKEN }}
          MBOTE_BOT_KEY: ${{ secrets.MBOTE_BOT_KEY }}

      - name: Build & démarrage
        if: steps.guard.outputs.ok == 'true'
        run: |
          ssh -p "$VPS_PORT" -i ~/.ssh/id_mbote_ci -o IdentitiesOnly=yes \
            "$VPS_USER@$VPS_HOST" \
            "cd '$VPS_DIR' && docker compose up -d --build && docker image prune -f"

      - name: Vérification santé
        if: steps.guard.outputs.ok == 'true'
        run: |
          ssh -p "$VPS_PORT" -i ~/.ssh/id_mbote_ci -o IdentitiesOnly=yes \
            "$VPS_USER@$VPS_HOST" \
            "sleep 6 && curl -fsS http://127.0.0.1:${VPS_WEB_PORT}/api/stats > /dev/null && echo '✅ API en bonne santé' && cd '$VPS_DIR' && docker compose ps"
