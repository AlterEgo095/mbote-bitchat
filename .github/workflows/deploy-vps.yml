# ─────────────────────────────────────────────────────────────────────────────
#  Mbote BitChat — Déploiement VPS (gâté par la CI — F-1, vague durcissement)
#  ─ Déclenchement : workflow_run APRÈS tests.yml (main) — aucun déploiement
#    d'un SHA qui n'a PAS passé le harnais adversarial. Le gate vérifie
#    EN PLUS security.yml : verte si elle a tourné pour ce SHA (ses filtres
#    paths signifient « deps/Docker/CI inchangés » quand elle est absente —
#    pass-through documenté dans docs/CI-AUDIT.md F-1).
#  ─ Le SHA déployé = le SHA TESTÉ (workflow_run.head_sha), jamais le HEAD
#    courant de main (qui peut avoir avancé entre-temps).
#  ─ Sémantique paths-ignore conservée (mobile/**, docs/**, *.md → skip) :
#    évaluée par git diff dans le gate (le push mobile/docs seul ne déploie pas).
#  ─ workflow_dispatch : deploy manuel — le gate reste ENFORCE (tests vertes
#    obligatoires sur le SHA) ; l'urgence passe par une run de tests d'abord,
#    pas par un contournement (F-1 : du code non testé ne part pas en prod).
#    Input `ref` (audit 2026-11 §4.5) : SHA/branche/tag à déployer — ROLLBACK
#    documenté docs/PRE-DEPLOY-CHECKLIST.md §Rollback. Le gate F-1 s'applique
#    au SHA fourni : il n'a jamais été testé vert → refus (aucun contournement).
#  ─ rsync du commit exact → docker compose up -d --build
#  ─ En cas d'échec de build : les anciens conteneurs continuent de tourner
#  ─ Idempotent : premier déploiement == 100e déploiement
#  ─ Secrets requis : VPS_HOST, VPS_USER, VPS_SSH_KEY (docs/CI-CD.md)
#  ─ Secrets temps réel (F-09, à créer dans GitHub → Settings → Secrets) :
#    NEXT_PUBLIC_SOCKET_URL, RELAY_ALLOWED_ORIGIN, SEED_SECRET,
#    RELAY_EMIT_TOKEN (F-51), MBOTE_BOT_KEY (F-29), ADMIN_API_KEY (A3 —
#    modération admin ; absente = modération OFF, 403 uniforme, défaut sûr),
#    TURN_SHARED_SECRET (C2 — appels WebRTC : schéma REST coturn,
#    credentials éphémères 600 s ; absente = /api/turn-credentials répond
#    available:false, appels dégradés ICE host/srflx + fallback notes vocales)
#    ADMIN_INTERNAL_TOKEN (ADM Étape 4 — RBAC §8 : identifie le panneau BFF
#    auprès de l'app principale ; absent = endpoints /api/internal/admin/*
#    refusés) et ADMIN_BASE_PATH + NEXT_PUBLIC_ADMIN_BASE_PATH (Go-to-Market
#    2026-11 — obscurcissement : chemin secret du panneau admin, ex.
#    /console-xxxx/ ; MÊME valeur pour les deux ; vide = racine)
#    VAPID_PUBLIC_KEY + VAPID_PRIVATE_KEY (audit 2026-11 §4.2 — Web Push
#    C1/réveil ; absentes = push DÉSACTIVÉ fail-closed côté sender). Voir
#    docs/RUNBOOK-ADMIN-KEY.md (génération : bunx web-push generate-vapid-keys)
#    — écrits dans le .env VPS. Voir docs/RUNBOOK-ADMIN-KEY.md.
#  ─ Distribution APK (Go-to-Market 2026-11) : le workflow télécharge sur le
#    VPS l'APK de la release GitHub « latest » (asset mbote-latest.apk, mis à
#    jour par build-android.yml) vers public/downloads/ — servi par Next et
#    nginx sur /downloads/mbote-latest.apk. Le dossier est exclu du rsync
#    (la version déjà présente sur le VPS survit à un échec de téléchargement).
#  ─ Le rsync PRÉSERVE le .env et docker-compose.override.yml du serveur
#    (bindings 127.0.0.1 selon la convention nginx-hôte, ports non standards).
# ─────────────────────────────────────────────────────────────────────────────
name: Déploiement VPS

permissions:
  contents: read # F-50 : le déploiement n'a besoin d'aucune écriture sur le dépôt
  actions: read # gate F-1 : lecture des conclusions tests.yml / security.yml pour le SHA

on:
  workflow_run:
    workflows: ["Tests — harness adversarial"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "SHA/branche/tag à déployer (ROLLBACK) — vide = dernier SHA testé sur main"
        required: false
        default: ""

concurrency:
  group: vps-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: gate CI (F-1) puis rsync + docker compose
    # Ne s'exécute que si le workflow DÉCLENCHEUR (tests.yml) est vert ; pour
    # un dispatch manuel, le gate de SHA ci-dessous fait la vérification.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      VPS_DIR: ${{ secrets.VPS_DEPLOY_DIR || '/opt/mbote-bitchat' }}
      VPS_WEB_PORT: ${{ secrets.VPS_WEB_PORT || '3000' }}
    steps:
      - name: Récupérer le dépôt au SHA TESTÉ (historique complet pour le diff)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (épinglé par SHA — supply chain)
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.ref || github.event.workflow_run.head_sha || github.sha }}

      - name: Gate F-1 — le SHA déployé a passé tests (+ security si exécutée)
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          SHA="${{ github.event.inputs.ref || github.event.workflow_run.head_sha || github.sha }}"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          if [ -n "${{ github.event.inputs.ref }}" ]; then
            echo "::notice::ROLLBACK demandé — déploiement du ref fourni $SHA (gate F-1 inchangé : tests vertes obligatoires sur ce SHA)"
          fi

          concl() {
            # dernière run COMPLÈTE du workflow $1 pour ce SHA (API : tri desc)
            gh api "repos/$REPO/actions/workflows/$1/runs?head_sha=$SHA&per_page=100" \
              --jq '[.workflow_runs[] | select(.status == "completed")] | .[0].conclusion // "absent"' \
              2>/dev/null || echo "absent"
          }

          # 0) paths-ignore (sémantique push historique conservée) : un push ne
          #    touchant que mobile/**, docs/** ou *.md ne déploie pas.
          if git cat-file -e "$SHA^" 2>/dev/null; then
            CHANGED="$(git diff --name-only "$SHA^" "$SHA" || true)"
          else
            CHANGED="" # push initial → diff indisponible → déployer
          fi
          RELEVANT="$(printf '%s\n' "$CHANGED" | grep -Ev '(^mobile/|^docs/|\.md$)' || true)"
          if [ -n "$CHANGED" ] && [ -z "$RELEVANT" ]; then
            echo "::notice::push $SHA ne touche que mobile/**, docs/** ou *.md — déploiement ignoré (paths-ignore conservés)"
            echo "ok=false" >> "$GITHUB_OUTPUT"; echo "reason=paths-ignore" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # 1) tests.yml : verte OBLIGATOIRE pour ce SHA — le cœur de F-1.
          TESTS="$(concl tests.yml)"
          if [ "$TESTS" != "success" ]; then
            echo "::error::F-1 : tests.yml n'est PAS vert sur $SHA (conclusion: $TESTS) — déploiement REFUSÉ (aucun code non testé ne part en prod)"
            echo "ok=false" >> "$GITHUB_OUTPUT"; echo "reason=tests-$TESTS" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # 2) security.yml : verte SI elle a tourné pour ce SHA. Absente =
          #    ses paths (package.json/bun.lock/Dockerfile*/security.yml)
          #    sont inchangés → l'audit précédent reste valide (pass-through
          #    documenté CI-AUDIT F-1). En échec → REFUS.
          SECURITY="$(concl security.yml)"
          if [ "$SECURITY" != "success" ] && [ "$SECURITY" != "absent" ]; then
            echo "::error::F-1 : security.yml est $SECURITY sur $SHA — déploiement REFUSÉ (audit des dépendances/Docker en échec)"
            echo "ok=false" >> "$GITHUB_OUTPUT"; echo "reason=security-$SECURITY" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$SECURITY" == "absent" ]; then
            echo "::notice::security.yml absente pour $SHA (paths deps/Docker inchangés) — pass-through documenté CI-AUDIT F-1"
          fi

          # 3) secrets VPS configurés ?
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ]; then
            echo "::warning::Secrets VPS absents (VPS_HOST, VPS_USER, VPS_SSH_KEY) — déploiement ignoré. Voir docs/CI-CD.md"
            echo "ok=false" >> "$GITHUB_OUTPUT"; echo "reason=vps-secrets" >> "$GITHUB_OUTPUT"; exit 0
          fi

          echo "→ gate F-1 PASS : tests=success security=$SECURITY — déploiement de $SHA vers $VPS_USER@$VPS_HOST:$VPS_DIR"
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Bun (portail qualité — lint web + typecheck)
        if: steps.gate.outputs.ok == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0 (épinglé par SHA — supply chain)
        with:
          bun-version: "1.3.14"

      - name: Portail qualité — lint + typecheck (racine)
        if: steps.gate.outputs.ok == 'true'
        run: |
          bun install --frozen-lockfile
          bun run lint
          bunx tsc --noEmit

      - name: Portail qualité — lint + typecheck (admin, audit 2026-11 §4.9)
        # Le panneau admin a son propre package.json — il n'était NI linté NI
        # typechecké par la CI (le build Docker échouait seulement en cas de
        # TS bloquant). Gates identiques à la racine : même niveau d'exigence.
        if: steps.gate.outputs.ok == 'true'
        run: |
          cd admin
          bun install --frozen-lockfile
          bun run lint
          bun run typecheck

      - name: Empreinte du déploiement
        if: steps.gate.outputs.ok == 'true'
        run: echo "${{ steps.gate.outputs.sha }}" > .deploy-commit

      - name: Synchroniser le code (rsync du SHA testé)
        if: steps.gate.outputs.ok == 'true'
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_mbote_ci
          chmod 600 ~/.ssh/id_mbote_ci
          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          rsync -az --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude '.next' \
            --exclude 'docs' \
            --exclude 'tests' \
            --exclude 'db' \
            --exclude 'download' \
            --exclude 'public/downloads' \
            --exclude 'tool-results' \
            --exclude '.zscripts' \
            --exclude '.claude' \
            --exclude 'skills' \
            --exclude '.env' \
            --exclude '.env.local' \
            --exclude 'docker-compose.override.yml' \
            --exclude 'backups' \
            --exclude '.backup-key' \
            --exclude '*.log' \
            -e "ssh -p ${VPS_PORT} -i ~/.ssh/id_mbote_ci -o IdentitiesOnly=yes" \
            ./ "$VPS_USER@$VPS_HOST:$VPS_DIR/"
          echo "✅ code synchronisé (commit $(cat .deploy-commit))"

      - name: APK Android — téléchargement sur le VPS (distribution directe)
        if: steps.gate.outputs.ok == 'true'
        run: |
          APK_URL="https://github.com/${{ github.repository }}/releases/download/latest/mbote-latest.apk"
          ssh -p "$VPS_PORT" -i ~/.ssh/id_mbote_ci -o IdentitiesOnly=yes "$VPS_USER@$VPS_HOST" \
            "mkdir -p '$VPS_DIR/public/downloads' && \
             if curl -fsSL --connect-timeout 15 --max-time 600 '$APK_URL' -o '$VPS_DIR/public/downloads/mbote-latest.apk.new'; then \
               mv '$VPS_DIR/public/downloads/mbote-latest.apk.new' '$VPS_DIR/public/downloads/mbote-latest.apk'; \
               echo '✅ APK mbote-latest.apk téléchargé sur le VPS (release « latest »)'; \
             elif [ -f '$VPS_DIR/public/downloads/mbote-latest.apk' ]; then \
               rm -f '$VPS_DIR/public/downloads/mbote-latest.apk.new'; \
               echo '::warning::Téléchargement APK échoué — conservation de la version déjà présente sur le VPS'; \
             else \
               echo '::warning::APK indisponible (release « latest » absente du dépôt) — /downloads/mbote-latest.apk répondra 404'; \
             fi"

      - name: Environnement de build (.env sur le VPS — 12 variables critiques)
        if: steps.gate.outputs.ok == 'true'
        run: |
          if [ -z "$ADMIN_API_KEY" ]; then
            echo "::warning::Secret ADMIN_API_KEY absent — la modération admin restera DÉSACTIVÉE en prod (403 uniforme, défaut sûr). Provisionner : gh secret set ADMIN_API_KEY --repo AlterEgo095/mbote-bitchat — voir docs/RUNBOOK-ADMIN-KEY.md"
          fi
          if [ -z "$TURN_SHARED_SECRET" ]; then
            echo "::warning::Secret TURN_SHARED_SECRET absent — /api/turn-credentials répondra available:false (appels dégradés ICE host/srflx, fallback notes vocales). Provisionner : gh secret set TURN_SHARED_SECRET --repo AlterEgo095/mbote-bitchat (valeur = static-auth-secret de /etc/turnserver.conf)"
          fi
          if [ -z "$ADMIN_INTERNAL_TOKEN" ]; then
            echo "::warning::Secret ADMIN_INTERNAL_TOKEN absent — les endpoints /api/internal/admin/* refuseront le panneau (défaut sûr). Provisionner : gh secret set ADMIN_INTERNAL_TOKEN --repo AlterEgo095/mbote-bitchat"
          fi
          if [ -z "$ADMIN_BASE_PATH" ]; then
            echo "::notice::Secret ADMIN_BASE_PATH absent — panneau admin servi à la racine (URL non obscurcie). Provisionner : gh secret set ADMIN_BASE_PATH --repo AlterEgo095/mbote-bitchat (ex. /console-xxxxxxxx)"
          fi
          if [ -z "$VAPID_PUBLIC_KEY" ] || [ -z "$VAPID_PRIVATE_KEY" ]; then
            echo "::warning::Secrets VAPID_PUBLIC_KEY/VAPID_PRIVATE_KEY absents — Web Push DÉSACTIVÉ (fail-closed côté sender). Provisionner : bunx web-push generate-vapid-keys puis gh secret set VAPID_PUBLIC_KEY / VAPID_PRIVATE_KEY --repo AlterEgo095/mbote-bitchat — voir docs/RUNBOOK-ADMIN-KEY.md"
          fi
          {
            echo "NEXT_PUBLIC_SOCKET_URL=${NEXT_PUBLIC_SOCKET_URL}"
            echo "RELAY_ALLOWED_ORIGIN=${RELAY_ALLOWED_ORIGIN}"
            echo "SEED_SECRET=${SEED_SECRET}"
            echo "RELAY_EMIT_TOKEN=${RELAY_EMIT_TOKEN}"
            echo "MBOTE_BOT_KEY=${MBOTE_BOT_KEY}"
            echo "ADMIN_API_KEY=${ADMIN_API_KEY}"
            echo "TURN_SHARED_SECRET=${TURN_SHARED_SECRET}"
            echo "ADMIN_INTERNAL_TOKEN=${ADMIN_INTERNAL_TOKEN}"
            echo "ADMIN_BASE_PATH=${ADMIN_BASE_PATH}"
            echo "NEXT_PUBLIC_ADMIN_BASE_PATH=${NEXT_PUBLIC_ADMIN_BASE_PATH}"
            echo "VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}"
            echo "VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}"
          } | ssh -p "$VPS_PORT" -i ~/.ssh/id_mbote_ci -o IdentitiesOnly=yes "$VPS_USER@$VPS_HOST" "cat > '$VPS_DIR/.env'"
          ssh -p "$VPS_PORT" -i ~/.ssh/id_mbote_ci -o IdentitiesOnly=yes "$VPS_USER@$VPS_HOST" "chmod 600 '$VPS_DIR/.env'"
          if [ -n "$ADMIN_API_KEY" ]; then
            echo "✅ .env écrit sur le VPS (F-09/F-51/F-29/F-02/A3/C2-TURN/ADM-4/GTM/VAPID — 12 variables, ADMIN_API_KEY incluse)"
          else
            echo "✅ .env écrit sur le VPS (11 variables — ADMIN_API_KEY absente : modération admin OFF)"
          fi
        env:
          NEXT_PUBLIC_SOCKET_URL: ${{ secrets.NEXT_PUBLIC_SOCKET_URL }}
          RELAY_ALLOWED_ORIGIN: ${{ secrets.RELAY_ALLOWED_ORIGIN }}
          SEED_SECRET: ${{ secrets.SEED_SECRET }}
          RELAY_EMIT_TOKEN: ${{ secrets.RELAY_EMIT_TOKEN }}
          MBOTE_BOT_KEY: ${{ secrets.MBOTE_BOT_KEY }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          TURN_SHARED_SECRET: ${{ secrets.TURN_SHARED_SECRET }}
          ADMIN_INTERNAL_TOKEN: ${{ secrets.ADMIN_INTERNAL_TOKEN }}
          ADMIN_BASE_PATH: ${{ secrets.ADMIN_BASE_PATH }}
          NEXT_PUBLIC_ADMIN_BASE_PATH: ${{ secrets.NEXT_PUBLIC_ADMIN_BASE_PATH }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}

      - name: Build & démarrage
        if: steps.gate.outputs.ok == 'true'
        run: |
          ssh -p "$VPS_PORT" -i ~/.ssh/id_mbote_ci -o IdentitiesOnly=yes \
            "$VPS_USER@$VPS_HOST" \
            "cd '$VPS_DIR' && docker compose up -d --build && docker image prune -f"

      - name: Vérification santé — 3 services + retries (audit 2026-11 §4.3)
        if: steps.gate.outputs.ok == 'true'
        run: |
          # les variables du workflow sont injectées dans l'env de la commande
          # distante (le heredoc est quoté : aucune expansion locale).
          ssh -p "$VPS_PORT" -i ~/.ssh/id_mbote_ci -o IdentitiesOnly=yes \
            "$VPS_USER@$VPS_HOST" \
            "VPS_WEB_PORT='${VPS_WEB_PORT}' VPS_DIR='${VPS_DIR}' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$VPS_DIR"

          # 1) les trois conteneurs doivent être healthy (mesh/admin/relay).
          #    start_period Next ≈ 40 s → 24 essais × 5 s = 120 s de tolérance.
          echo "→ attente healthchecks docker (mbote-mesh, mbote-admin, mbote-relay)"
          for i in $(seq 1 24); do
            UNHEALTHY=$(docker inspect --format '{{.Name}}={{.State.Health.Status}}' mbote-mesh mbote-admin mbote-relay 2>/dev/null | awk -F= '$2 != "healthy" {printf "%s ", $0}')
            if [ "$UNHEALTHY" = "" ]; then
              echo "✅ 3/3 conteneurs healthy (essai $i)"
              break
            fi
            echo "  essai $i/24 — pas encore healthy : $UNHEALTHY"
            if [ "$i" = "24" ]; then
              echo "::error::healthchecks docker non verts après 120 s : $UNHEALTHY — déploiement DÉFAILLANT"
              docker compose ps
              exit 1
            fi
            sleep 5
          done

          # 2) l'API publique répond-elle ? (curl + retries — détection d'une
          #    app construite mais cassée au runtime)
          echo "→ sonde HTTP /api/stats (local)"
          for i in $(seq 1 12); do
            if curl -fsS --max-time 5 "http://127.0.0.1:${VPS_WEB_PORT}/api/stats" > /dev/null 2>&1; then
              echo "✅ /api/stats répond (essai $i)"
              docker compose ps
              exit 0
            fi
            echo "  essai $i/12 — /api/stats ne répond pas encore"
            sleep 5
          done
          echo "::error::/api/stats injoignable après 60 s — déploiement DÉFAILLANT (rollback manuel : re-dispatch sur le SHA précédent, docs/PRE-DEPLOY-CHECKLIST.md §Rollback)"
          docker compose ps
          exit 1
          REMOTE
