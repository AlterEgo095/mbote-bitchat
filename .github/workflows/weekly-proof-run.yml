# ─────────────────────────────────────────────────────────────────────────────
#  Mbote BitChat — Preuves navigateur HEBDOMADAIRES (DEV-SETUP §7)
# ─────────────────────────────────────────────────────────────────────────────
#  Problème visé (directive 2026-11-13, Clarification 1 vague D2+D3) : les
#  preuves navigateur (*.proof-run.sh) ne tournaient qu'en LOCAL manuel. Si un
#  composant client casse plus tard (CSP, Permissions-Policy, WebSocket, fake
#  devices, hydratation — 4 vagues consécutives de bugs invisibles aux
#  harnais), la CI restait verte. Ce workflow exécute les 5 runners critiques
#  (D1 recherche · C2 audio · C3 vidéo · C4 MLS · G i18n) une fois par semaine.
#
#  SKIP PROPRE (documenté, jamais silencieux) : si les prérequis ne peuvent
#  pas être installés (chromium, réseau), le job est SUCCESS mais avec :
#   - un step nommé « SKIP — ... » avec annotation ::notice::,
#   - un résumé de job (GITHUB_STEP_SUMMARY) expliquant la raison et rappelant
#     que la preuve navigateur reste OBLIGATOIRE en local avant livraison.
#
#  Leçon CI rouge ed25110 (2026-11-15) : le step d'install `bunx playwright-core
#  install` était reparti exit 0 SANS produire chromium-1200 (résolution de
#  version ≠ lockfile et/ou PLAYWRIGHT_BROWSERS_PATH de l'image runner) → D1
#  plantait « Chromium introuvable ». Le gate décide désormais sur le
#  FILESYSTEM (binaire attendu présent et exécutable), pas sur l'exit code de
#  l'install — et l'install est épinglée (version lockfile + chemin des scripts).
#  Docker est vérifié et rapporté pour traçabilité (les 4 runners n'en
#  dépendent pas directement : TURN = harnais bun, DB = SQLite fichier).
#
#  Vague G : le runner g-i18n-proof-run.sh rejoint la file (i18n FR/EN +
#  non-régression C1 reload post-MLS). NB artefacts : le glob est passé en
#  récursif (assets/**) — les preuves par vague vivent dans des sous-dossiers
#  (F/…, G/fr-…, G/en-…) que l’ancien glob plat ne remontait pas.
#
#  Supply chain : actions épinglées par SHA de commit (condition 6) — mêmes
#  SHA que tests.yml/security.yml.
# ─────────────────────────────────────────────────────────────────────────────
name: "Preuves navigateur — hebdomadaires (§7 DEV-SETUP)"

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1" # hebdomadaire — lundi 07:00 UTC (après security.yml 06:00)
  push:
    branches: ["feat/**"]
    paths:
      - ".github/workflows/weekly-proof-run.yml"
      - "scripts/*proof-run.sh"

permissions:
  contents: read # lecture seule (F-50)

jobs:
  browser-proofs:
    name: Runners de preuve navigateur (D1 · C2 · C3 · C4 · G)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 — épinglé par SHA

      - name: Bun (version pinned = lockfile reproductible)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0 — épinglé par SHA
        with:
          bun-version: "1.3.14"

      - name: Installer les dépendances (lockfile strict)
        run: bun install --frozen-lockfile

      - name: "Garde-fous — prérequis navigateur (install épinglée + binaire VÉRIFIÉ, sinon SKIP documenté)"
        id: prereqs
        run: |
          {
            echo "## Prérequis des preuves navigateur"
            echo ""
            if docker info >/dev/null 2>&1; then
              echo "- docker : disponible (rapporté pour traçabilité — les 5 runners n'en dépendent pas directement)"
            else
              echo "- docker : INDISPONIBLE (les 5 runners n'en dépendent pas directement — non bloquant)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "docker=$(docker info >/dev/null 2>&1 && echo disponible || echo indisponible)" >> "$GITHUB_OUTPUT"
          # Chromium : TROIS couches (leçon CI rouge ed25110) :
          #   1. version ÉPINGLÉE = playwright-core@1.65.0 du bun.lock (→ build
          #      chromium-1200 ; bunx sans version pouvait en résoudre une autre) ;
          #   2. PLAYWRIGHT_BROWSERS_PATH ÉPINGLÉ au chemin CODÉ des scripts de
          #      preuve (~/.cache/ms-playwright — l'image runner peut en exposer
          #      un autre via l'environnement) ;
          #   3. le binaire attendu est VÉRIFIÉ au filesystem ([ -x ]) AVANT
          #      d'autoriser les runners — l'exit code de l'install ne suffit pas
          #      (il a été exit 0 sans binaire le jour du rouge).
          #  Binaire absent après installation → SKIP documenté (jamais rouge
          #  pour un binaire manquant, jamais silencieux) : annotation ::notice::
          #  + diagnostic du cache dans le résumé.
          export PLAYWRIGHT_BROWSERS_PATH="$HOME/.cache/ms-playwright"
          CHROME_BIN="$HOME/.cache/ms-playwright/chromium-1200/chrome-linux64/chrome"
          bunx playwright-core@1.65.0 install --with-deps chromium \
            || bunx playwright-core@1.65.0 install chromium
          if [ -x "$CHROME_BIN" ]; then
            echo "skip=" >> "$GITHUB_OUTPUT"
            echo "- chromium : installé et VÉRIFIÉ au chemin attendu — \`$CHROME_BIN\` (playwright-core@1.65.0 = bun.lock → chromium-1200)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=chromium" >> "$GITHUB_OUTPUT"
            echo "- chromium : ABSENT après installation épinglée (\`$CHROME_BIN\`) → preuves navigateur SKIPPÉES (raison documentée ci-dessous)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Diagnostic — contenu du cache navigateurs :" >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
            if [ -d "$HOME/.cache/ms-playwright" ]; then
              ls -la "$HOME/.cache/ms-playwright" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "(cache $HOME/.cache/ms-playwright absent)" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          fi

      - if: steps.prereqs.outputs.skip == ''
        name: "D1 — recherche FTS5 + frontière DM (preuve navigateur)"
        run: bash scripts/d1-search-proof-run.sh

      - if: steps.prereqs.outputs.skip == ''
        name: "C2 — appels audio 1:1 WebRTC (preuve navigateur)"
        run: bash scripts/c2-audio-calls-proof-run.sh

      - if: steps.prereqs.outputs.skip == ''
        name: "C3 — appels vidéo 1:1 WebRTC (preuve navigateur)"
        run: bash scripts/c3-video-calls-proof-run.sh

      - if: steps.prereqs.outputs.skip == ''
        name: "C4 — groupes privés MLS (preuve navigateur)"
        run: bash scripts/c4-mls-groups-proof-run.sh

      - if: steps.prereqs.outputs.skip == ''
        name: "G — i18n FR/EN + reload post-MLS (preuve navigateur)"
        run: bash scripts/g-i18n-proof-run.sh

      - if: steps.prereqs.outputs.skip != ''
        name: "SKIP — preuves navigateur non exécutées (raison explicite)"
        run: |
          echo "::notice::Preuves navigateur SKIPPÉES — prérequis manquant : ${{ steps.prereqs.outputs.skip }}. Ce skip est DOCUMENTÉ (pas un fail silencieux) : voir résumé du job. La preuve navigateur reste OBLIGATOIRE en local avant toute livraison (docs/DEV-SETUP.md §7)."
          {
            echo "## ⏭️ Preuves navigateur SKIPPÉES"
            echo ""
            echo "**Raison** : prérequis manquant — \`${{ steps.prereqs.outputs.skip }}\`."
            echo ""
            echo "Le skip est volontaire et traçable (jamais silencieux) : la discipline"
            echo "§7 de docs/DEV-SETUP.md exige une preuve navigateur réelle pour tout"
            echo "nouveau flux utilisateur — en LOCAL avant livraison. Ce workflow est"
            echo "la filet hebdomadaire de non-régression."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publier les assets de preuve (captures, JSON, logs)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4.6.2 — épinglé par SHA
        with:
          name: proof-assets
          path: |
            docs/proofs/assets/**
          retention-days: 30
          if-no-files-found: ignore
