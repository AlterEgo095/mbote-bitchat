# ─────────────────────────────────────────────────────────────────────────────
#  Mbote BitChat — Dependabot (mises à jour automatiques des dépendances)
#  ─ Hebdomadaire ; les mises à jour mineures/patch sont GROUPÉES pour limiter
#    le bruit des PR (les majeures restent des PR individuelles, plus risquées).
#  ─ Écosystèmes couverts : Docker ×2 (images épinglées par digest),
#    github-actions (bump des SHA épinglés quand une version sort).
#  ─ PAS d'écosystème npm : Dependabot ne lit pas les lockfiles Bun (bun.lock).
#    L'analyse des vulnérabilités npm est assurée par
#    .github/workflows/security.yml (npm audit --audit-level=high, hebdomadaire
#    + sur chaque push affectant les dépendances).
#  ─ Historique : les entrées npm ont été retirées le 2026-11-04 — le run
#    dependabot npm_and_yarn échouait systématiquement (lockfile non supporté).
# ─────────────────────────────────────────────────────────────────────────────
version: 2

updates:
  # Images Docker (base oven/bun épinglée par digest) — app racine
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly

  # Images Docker — relay
  - package-ecosystem: docker
    directory: "/mini-services/relay-service"
    schedule:
      interval: weekly

  # Actions GitHub utilisées dans .github/workflows/ — les références épinglées
  # par SHA sont suivies par Dependabot (PR de bump de SHA à chaque release)
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
