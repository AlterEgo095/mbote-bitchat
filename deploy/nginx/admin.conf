# ─────────────────────────────────────────────────────────────────────────────
# mbote-admin — vhost nginx du panneau d'administration (template).
# Installation : docs/specs/ADMIN-ACCESS-RUNBOOK.md §3 (cp + sed + ln + reload).
# Chaîne d'accès : CF Access (barrière primaire) → ce vhost → 127.0.0.1:3001.
# Le fallback IP allowlist reste COMMENTÉ : il ne remplace pas CF Access
# (décision audit §4.5), il protège uniquement si CF est contourné.
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name admin.MBOTE_DOMAIN;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name admin.MBOTE_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/admin.MBOTE_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.MBOTE_DOMAIN/privkey.pem;
    server_tokens off;

    # Défense en profondeur (l'app admin pose déjà ces en-têtes — redondance voulue)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Fallback si CF Access est contourné (décommenter + remplacer par l'IP opérateur) :
    # allow <IP_OPERATEUR>/32;
    # deny all;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
        # Pas d'upload côté admin — garder la surface minimale
        client_max_body_size 1m;
    }
}
