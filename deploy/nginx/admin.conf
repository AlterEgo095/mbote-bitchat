# ─────────────────────────────────────────────────────────────────────────────
# mbote-admin — vhost nginx du panneau d'administration (template).
#
# Go-to-Market 2026-11 : DEUX modes de distribution (l'un OU l'autre) :
#
#  MODE A (ACTIF en production — obscurcissement par CHEMIN SECRET) :
#    Le panneau est servi par le vhost PRINCIPAL (mbotemesh.aenews.online)
#    sous un chemin imprévisible (ADMIN_BASE_PATH, ex. /console-xxxxxxxx/),
#    avec Basic Auth nginx en couche supplémentaire (au-dessus du login admin
#    Argon2id+TOTP). Ce fichier sert alors de RÉFÉRENCE DOCUMENTAIRE — le
#    bloc location correspondant vit dans le vhost principal.
#    Chaîne d'accès : CF (TLS+proxy) → geo Cloudflare-only → Basic Auth →
#    127.0.0.1:3392 (basePath Next) → login admin (Argon2id + TOTP + RBAC).
#
#  MODE B (sous-domaine dédié — nécessite création DNS Cloudflare + certbot) :
#    Décommenter ce vhost, remplacer MBOTE_DOMAIN, créer le CNAME proxifié
#    (nuage orange) puis `certbot certonly --nginx -d admin.MBOTE_DOMAIN`.
#    Port hôte : 3392 (docker-compose.override.yml du VPS — 3001 est occupé
#    par une autre application sur ce serveur partagé).
#
# ⚠️  JAMAIS 127.0.0.1:3001 depuis nginx HÔTE : ce port est occupé par une
#     autre app du serveur (siteaenews-frontend). Le conteneur admin écoute
#     sur l'hôte via l'override compose : 127.0.0.1:3392.
# ─────────────────────────────────────────────────────────────────────────────

