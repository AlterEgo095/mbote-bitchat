<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mbote Mesh — hors ligne</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0a0f0d;
    color: #e7f0ec;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 24px;
    text-align: center;
  }
  .card {
    max-width: 420px;
    border: 1px solid rgba(120, 200, 170, 0.25);
    border-radius: 16px;
    padding: 32px 24px;
    background: rgba(255, 255, 255, 0.02);
  }
  .dot {
    width: 12px; height: 12px; border-radius: 999px;
    background: #f59e0b;
    display: inline-block;
    margin-bottom: 14px;
  }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { font-size: 14px; line-height: 1.55; color: #9fb8ad; margin: 0 0 20px; }
  button {
    appearance: none;
    border: 0;
    border-radius: 10px;
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 600;
    background: #2fbf8f;
    color: #062018;
    cursor: pointer;
  }
  button:focus-visible { outline: 2px solid #2fbf8f; outline-offset: 2px; }
  small { display: block; margin-top: 18px; color: #6d8a7e; font-size: 11px; }
</style>
</head>
<body>
  <main class="card" role="status">
    <span class="dot" aria-hidden="true"></span>
    <h1>Hors ligne — mode courrier</h1>
    <p>
      Le réseau est injoignable, mais Mbote Mesh reste là : ton identité vit sur
      ton appareil et tes messages partent en file locale, prêts à être délivrés
      dès le retour du réseau.
    </p>
    <button onclick="location.reload()">Réessayer</button>
    <small>Mbote Mesh — le réseau social qui survit aux coupures</small>
  </main>
</body>
</html>
