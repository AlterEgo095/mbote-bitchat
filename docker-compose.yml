services:
  mbote:
    # F-09 : NEXT_PUBLIC_SOCKET_URL doit être présente AU MOMENT du build
    # (elle est inlinée dans le bundle client Next). Elle provient du .env
    # écrit sur le VPS par la CI (cf. .github/workflows/deploy-vps.yml).
    build:
      context: .
      args:
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-}
    container_name: mbote-mesh
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/db/custom.db
      - NEXT_TELEMETRY_DISABLED=1
      - RELAY_EMIT_URL=http://relay:3031
    volumes:
      - mbote-data:/app/db
    restart: unless-stopped
    depends_on:
      relay:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "await fetch('http://localhost:3000/api/stats').then(r => { if (!r.ok) throw new Error('unhealthy'); })",
        ]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 20s

  relay:
    build: ./mini-services/relay-service
    container_name: mbote-relay
    # 3030 (socket.io navigateurs) publié sur 127.0.0.1 uniquement :
    # Caddy/nginx tourne sur l'hôte et proxifie vers 127.0.0.1:3030.
    # 3031 (endpoint interne /emit) n'est PAS publié : réseau Docker interne.
    ports:
      - "127.0.0.1:3030:3030"
    # F-09 : origine autorisée par le relay (CORS), lue depuis le .env du VPS.
    environment:
      - RELAY_ALLOWED_ORIGIN=${RELAY_ALLOWED_ORIGIN:-}
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "await fetch('http://localhost:3031/health').then(r => { if (!r.ok) throw new Error('unhealthy'); })",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mbote-data:
