services:
  mbote:
    # F-09 : NEXT_PUBLIC_SOCKET_URL doit être présente AU MOMENT du build
    # (elle est inlinée dans le bundle client Next). Elle provient du .env
    # écrit sur le VPS par la CI (cf. .github/workflows/deploy-vps.yml).
    build:
      context: .
      args:
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-}
    container_name: mbote-mesh
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/db/custom.db
      - NEXT_TELEMETRY_DISABLED=1
      - RELAY_EMIT_URL=http://relay:3031
      - RELAY_EMIT_TOKEN=${RELAY_EMIT_TOKEN:-}
      # Interpolation depuis le .env écrit sur le VPS par la CI (deploy-vps.yml) :
      # ces variables existaient dans le .env mais n'étaient pas déclarées ici —
      # elles ne pouvaient atteindre le conteneur que via un override VPS.
      # Déclarées explicitement à la clôture d'incidents 2026-11-05 :
      #   SEED_SECRET (F-02) · MBOTE_BOT_KEY (F-29) · ADMIN_API_KEY (A3,
      #   vide = modération admin OFF, 403 uniforme — RUNBOOK-ADMIN-KEY.md).
      - SEED_SECRET=${SEED_SECRET:-}
      - MBOTE_BOT_KEY=${MBOTE_BOT_KEY:-}
      - ADMIN_API_KEY=${ADMIN_API_KEY:-}
      # ADM Étape 4 (RBAC) : token interne mbote↔admin, timing-safe, JAMAIS en
      # DB ni en réponse HTTP — ne ressuscite pas ADMIN_API_KEY (RBAC §8).
      # Inutilisé avant l'Étape 4 ; déclaré dès maintenant pour figer le contrat.
      - ADMIN_INTERNAL_TOKEN=${ADMIN_INTERNAL_TOKEN:-}
      # C1 — push notifications (Web Push VAPID) : sans elles le push est
      # DÉSACTIVÉ fail-closed (GET /api/push/config → 503, UI masquée).
      # Générer : bunx web-push generate-vapid-keys
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-mailto:admin@mbotemesh.aenews.online}
      # C2 — TURN (appels WebRTC, schéma REST coturn). URLs NON sensibles :
      # IP publique VPS + port 3478 TCP+UDP (décision O-A 2026-11-16 : 443 est
      # occupé par nginx ; le domaine est proxifié Cloudflare qui ne route pas
      # 3478 → IP directe). Le SECRET, lui, ne vit JAMAIS dans le repo : il
      # arrive via le .env écrit par deploy-vps.yml (secret GitHub
      # TURN_SHARED_SECRET) — sans lui, /api/turn-credentials répond
      # available:false (mode dégradé ICE host/srflx, fallback notes vocales).
      - TURN_URLS=turn:95.111.226.63:3478?transport=udp,turn:95.111.226.63:3478?transport=tcp
      - TURN_SHARED_SECRET=${TURN_SHARED_SECRET:-}
    volumes:
      - mbote-data:/app/db
    # ── D3 — durcissement runtime (docs/DOCKER-HARDENING.md) ──
    # read_only : le conteneur n'écrit QUE /app/db (volume) et /tmp
    # (tmpfs) — le cache Next (image optimization) est un tmpfs éphémère.
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL # ports > 1024 : aucun cap_add nécessaire (NET_BIND_SERVICE inutile)
    restart: unless-stopped
    depends_on:
      relay:
        condition: service_healthy
    healthcheck:
      # Garde post-migration (clôture d'incidents 2026-11-05, suite de I-2) :
      # le conteneur ne passe healthy que si au moins une migration Prisma est
      # APPLIQUÉE (`_prisma_migrations.finished_at` non vide) ET que l'API
      # répond. bun:sqlite est un builtin — l'image n'a pas de CLI sqlite3.
      # `readonly` : le healthcheck ne doit jamais écrire dans la DB.
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const { Database } = require('bun:sqlite'); const p = (process.env.DATABASE_URL || 'file:/app/db/custom.db').replace(/^file:/, ''); const db = new Database(p, { readonly: true }); const m = db.query('SELECT 1 AS ok FROM _prisma_migrations WHERE finished_at IS NOT NULL LIMIT 1').get(); if (!m) throw new Error('migrations non appliquees (_prisma_migrations vide)'); await fetch('http://localhost:3000/api/stats').then(r => { if (!r.ok) throw new Error('API unhealthy: ' + r.status); });",
        ]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 30s

  relay:
    build: ./mini-services/relay-service
    container_name: mbote-relay
    # 3030 (socket.io navigateurs) publié sur 127.0.0.1 uniquement :
    # Caddy/nginx tourne sur l'hôte et proxifie vers 127.0.0.1:3030.
    # 3031 (endpoint interne /emit) n'est PAS publié : réseau Docker interne.
    ports:
      - "127.0.0.1:3030:3030"
    # F-09 : origine autorisée par le relay (CORS), lue depuis le .env du VPS.
    # F-51 : token /emit optionnel — définir RELAY_EMIT_TOKEN dans le .env VPS
    # pour exiger l'en-tête x-emit-token sur l'endpoint interne d'émission.
    environment:
      - RELAY_ALLOWED_ORIGIN=${RELAY_ALLOWED_ORIGIN:-}
      - RELAY_EMIT_TOKEN=${RELAY_EMIT_TOKEN:-}
    # ── D3 — durcissement : relay sans état (aucune écriture persistante)
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "await fetch('http://localhost:3031/health').then(r => { if (!r.ok) throw new Error('unhealthy'); })",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  admin:
    # ADM Étape 2 — squelette du panneau (docs/specs/ADMIN-RBAC.md §8) :
    # BFF sans état, ZÉRO accès DB (pas de prisma dans admin/package.json),
    # publié UNIQUEMENT sur 127.0.0.1:3001 — nginx est le seul point d'entrée
    # public, derrière Cloudflare Access (décision audit §4.5).
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        # Go-to-Market 2026-11 — chemin secret du panneau (obscurcissement) :
        # basePath Next (routage serveur) + base des fetch client. MÊME valeur
        # que l'env runtime ci-dessous — provient du .env VPS écrit par la CI.
        ADMIN_BASE_PATH: ${ADMIN_BASE_PATH:-}
        NEXT_PUBLIC_ADMIN_BASE_PATH: ${NEXT_PUBLIC_ADMIN_BASE_PATH:-}
    container_name: mbote-admin
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - PORT=3001
      - HOSTNAME=0.0.0.0
      - BACKEND_INTERNAL_URL=http://mbote:3000
      - ADMIN_INTERNAL_TOKEN=${ADMIN_INTERNAL_TOKEN:-}
      # Chemin secret au RUNTIME : scope du cookie de session admin (RBAC —
      # le cookie n'est plus émis vers les routes publiques du domaine).
      - ADMIN_BASE_PATH=${ADMIN_BASE_PATH:-}
    # ── D3 — durcissement : BFF sans état (cache Next en tmpfs)
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      mbote:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # 2 états testés (preuve ADM-step1-2.md) : 200 ok / 503 degraded —
      # un backend mort rend ce conteneur visiblement unhealthy.
      # GTM 2026-11 : le panneau peut être servi sous ADMIN_BASE_PATH
      # (obscurcissement /console-xxxx/) — la route /api/health vit alors sous
      # ce chemin ; la sonde est basePath-aware (défaut racine inchangé).
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const b = process.env.ADMIN_BASE_PATH || ''; await fetch('http://localhost:3001' + b + '/api/health').then(r => { if (!r.ok) throw new Error('unhealthy: ' + r.status); })",
        ]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 15s

volumes:
  mbote-data:
